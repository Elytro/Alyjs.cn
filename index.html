<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="alyjs.cn - 用户登录">
    <title>登录 - alyjs.cn</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #d1d5db;
            --text: #1f2937;
            --muted: #6b7280;
            --error: #dc2626;
            --radius: 10px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #eef2ff 0%, #f5f5f5 100%);
            color: var(--text);
        }

        /* 登录框与页脚同一容器，保证页脚始终位于登录框正下方 */
        .wrapper { width: 100%; max-width: 400px; }

        .card {
            padding: 2.5rem;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 1rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 12px;
        }

        .card h1 { margin: 0 0 .35rem; font-size: 1.4rem; text-align: center; }

        .subtitle {
            margin: 0 0 2rem;
            font-size: .875rem;
            color: var(--muted);
            text-align: center;
        }

        .field { margin-bottom: 1.1rem; }

        .field label {
            display: block;
            margin-bottom: .4rem;
            font-size: .875rem;
            font-weight: 500;
        }

        .input-wrap { position: relative; }

        .input-wrap .icon {
            position: absolute;
            top: 50%;
            left: .75rem;
            width: 18px;
            height: 18px;
            color: #9ca3af;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .field input {
            width: 100%;
            padding: .7rem .85rem .7rem 2.5rem;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .field input::placeholder { color: #b0b6bf; }

        .field input.has-suffix { padding-right: 7rem; }

        .input-wrap .suffix {
            position: absolute;
            top: 50%;
            right: .85rem;
            font-size: .95rem;
            color: var(--muted);
            transform: translateY(-50%);
            pointer-events: none;
            user-select: none;
        }

        .hint {
            margin: .4rem 0 0;
            font-size: .78rem;
            color: var(--muted);
        }

        .field.has-error .hint { display: none; }

        .field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .field.has-error input {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, .12);
        }

        .error-text {
            display: none;
            margin: .4rem 0 0;
            font-size: .8rem;
            color: var(--error);
        }

        .field.has-error .error-text { display: block; }

        .pw-toggle {
            position: absolute;
            top: 50%;
            right: .5rem;
            display: flex;
            padding: .3rem;
            color: #9ca3af;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transform: translateY(-50%);
            transition: color .15s;
        }

        .pw-toggle:hover { color: var(--text); }
        .pw-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
        .pw-toggle svg { width: 18px; height: 18px; }
        .pw-toggle .eye-off { display: none; }
        .pw-toggle.is-visible .eye { display: none; }
        .pw-toggle.is-visible .eye-off { display: block; }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.25rem 0;
            font-size: .85rem;
        }

        .row a { color: var(--primary); text-decoration: none; }
        .row a:hover { text-decoration: underline; }

        .remember {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin: 0;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .remember input { accent-color: var(--primary); cursor: pointer; }

        .btn {
            width: 100%;
            padding: .8rem;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background .15s, transform .05s;
        }

        .btn:hover:not(:disabled) { background: var(--primary-hover); }
        .btn:active:not(:disabled) { transform: translateY(1px); }
        .btn:disabled { opacity: .7; cursor: not-allowed; }

        .form-error {
            display: none;
            margin: 0 0 1rem;
            padding: .6rem .75rem;
            font-size: .85rem;
            color: var(--error);
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
        }

        .form-error.show { display: block; }

        .footer {
            margin-top: 1.25rem;
            font-size: .8rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.9;
        }

        .footer p { margin: 0; }
        .footer a { color: var(--muted); text-decoration: none; }
        .footer a:hover { color: var(--primary); }

        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1>alyjs.cn</h1>
            <p class="subtitle">登录您的账号</p>

            <!-- TODO: 填写后端登录接口地址后即可真实提交 -->
            <form id="loginForm" novalidate>
                <p class="form-error" id="formError" role="alert"></p>

                <div class="field" id="emailField">
                    <label for="email">邮箱</label>
                    <div class="input-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="text" id="email" name="email" class="has-suffix"
                               autocomplete="username" placeholder="请输入会员编号"
                               spellcheck="false" autocapitalize="off" autofocus required>
                        <span class="suffix">@alyjs.com</span>
                    </div>
                    <p class="hint">只需输入会员编号，完整邮箱为「会员编号@alyjs.com」</p>
                    <p class="error-text">请输入 1-64 位字母、数字、点、下划线或短横线</p>
                </div>

                <div class="field" id="passwordField">
                    <label for="password">密码</label>
                    <div class="input-wrap">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" placeholder="请输入密码" required>
                        <button type="button" class="pw-toggle" id="pwToggle"
                                aria-label="显示密码" aria-pressed="false">
                            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <p class="error-text">密码长度不能少于 6 位</p>
                </div>

                <div class="row">
                    <label class="remember">
                        <input type="checkbox" id="remember" name="remember"> 记住我
                    </label>
                    <a href="#">忘记密码？</a>
                </div>

                <button type="submit" class="btn" id="submitBtn">登录</button>
            </form>
        </div>

        <footer class="footer">
            <p>&copy; <span id="year">2026</span> alyjs.cn 版权所有</p>
            <p>
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鲁ICP备2025144109号-25</a>
            </p>
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        var LOGIN_URL = ''; // TODO: 填写后端登录接口地址，例如 '/api/login'
        var EMAIL_DOMAIN = 'alyjs.com'; // 预设邮箱域名，用户只需输入前缀

        var form = document.getElementById('loginForm');
        var emailField = document.getElementById('emailField');
        var passwordField = document.getElementById('passwordField');
        var email = document.getElementById('email');
        var password = document.getElementById('password');
        var submitBtn = document.getElementById('submitBtn');
        var formError = document.getElementById('formError');
        var pwToggle = document.getElementById('pwToggle');

        function getFullEmail() {
            return email.value.trim() + '@' + EMAIL_DOMAIN;
        }

        function checkEmail() {
            var prefix = email.value.trim();
            var ok = prefix.length > 0 && prefix.length <= 64 &&
                     /^[A-Za-z0-9._-]+$/.test(prefix);
            emailField.classList.toggle('has-error', !ok);
            return ok;
        }

        function checkPassword() {
            var ok = password.value.length >= 6;
            passwordField.classList.toggle('has-error', !ok);
            return ok;
        }

        email.addEventListener('blur', checkEmail);
        email.addEventListener('input', function () {
            if (emailField.classList.contains('has-error')) checkEmail();
        });
        password.addEventListener('blur', checkPassword);
        password.addEventListener('input', function () {
            if (passwordField.classList.contains('has-error')) checkPassword();
        });

        pwToggle.addEventListener('click', function () {
            var show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            pwToggle.classList.toggle('is-visible', show);
            pwToggle.setAttribute('aria-pressed', String(show));
            pwToggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        });

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? '登录中...' : '登录';
        }

        function showError(msg) {
            formError.textContent = msg;
            formError.classList.add('show');
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            formError.classList.remove('show');

            if (!checkEmail()) { email.focus(); return; }
            if (!checkPassword()) { password.focus(); return; }

            if (!LOGIN_URL) {
                // 未配置接口时仅做前端演示
                setLoading(true);
                setTimeout(function () { setLoading(false); }, 800);
                return;
            }

            setLoading(true);
            fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: getFullEmail(),
                    password: password.value,
                    remember: document.getElementById('remember').checked
                })
            })
                .then(function (res) {
                    if (!res.ok) throw new Error('登录失败');
                    return res.json();
                })
                .then(function (data) {
                    // TODO: 按后端返回处理，例如保存 token 并跳转
                    // localStorage.setItem('token', data.token);
                    // location.href = '/';
                    setLoading(false);
                })
                .catch(function () {
                    setLoading(false);
                    showError('邮箱或密码错误，请重试');
                });
        });
    </script>
</body>
</html>
